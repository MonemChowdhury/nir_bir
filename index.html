<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;500;700&family=Pinyon+Script&display=swap">
<style id="app-style">
/* Layout: a storybook of full-height "pages" on midnight plum; one scene at a time, photos framed on cream paper. */
:root{
  --plum-950:#160b1c; --plum-900:#1f1027; --plum-800:#2c1736; --plum-700:#3e2149;
  --rose:#ec8fab; --rose-deep:#c85a7e; --gold:#e4b961; --gold-soft:#f3dca2;
  --cream:#faf1e4; --paper:#f6ead8; --ink:#2a1630; --muted:#d3bfd0; --line:rgba(243,220,162,.28);
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-body:"Karla","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--plum-950);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden}
img,video{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}

#shell{height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative;isolation:isolate;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(200,90,126,.28), transparent 60%),
    radial-gradient(90% 60% at 100% 100%, rgba(228,185,97,.12), transparent 60%),
    radial-gradient(80% 60% at 0% 80%, rgba(62,33,73,.9), transparent 70%),
    var(--plum-900)}
#shell::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%, rgba(250,241,228,.5), transparent 60%),radial-gradient(1px 1px at 70% 15%, rgba(250,241,228,.35), transparent 60%),radial-gradient(1.5px 1.5px at 85% 60%, rgba(243,220,162,.4), transparent 60%),radial-gradient(1px 1px at 35% 80%, rgba(250,241,228,.3), transparent 60%),radial-gradient(1px 1px at 55% 45%, rgba(250,241,228,.25), transparent 60%)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dots{display:flex;gap:6px;align-items:center;min-width:0}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(243,220,162,.25);transition:all .4s}
.dots span.done{background:var(--gold)}
.dots span.now{width:22px;border-radius:4px;background:var(--rose)}
.sound{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(22,11,28,.45);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;min-height:40px}
.sound svg{width:18px;height:18px}
.sound[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft)}

#stage{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none;position:relative}
.scene{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;
  padding-block:20px 32px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-width:680px;margin:0 auto}
.scene.enter{animation:pageIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);margin:0}
.display{font-family:var(--f-display);font-weight:500;font-size:clamp(42px,12vw,76px);line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.display em{font-style:italic;color:var(--rose)}
h2.title{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,8.6vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h2.title em{color:var(--rose);font-style:italic}
.lede{color:var(--muted);margin:0;max-width:34ch;text-wrap:pretty}
.script{font-family:var(--f-script);font-size:clamp(30px,8vw,40px);color:var(--gold-soft);line-height:1.2;margin:0}
.datestamp{font-family:var(--f-display);font-size:clamp(28px,7.5vw,40px);font-style:italic;color:var(--gold);margin:0;line-height:1.1}

.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:14px 26px;min-height:48px;font-weight:700;font-size:16px;letter-spacing:.02em;transition:transform .15s, box-shadow .2s, background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 10px 30px -10px rgba(236,143,171,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.small{padding:9px 16px;min-height:40px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.navbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid rgba(243,220,162,.12);background:rgba(22,11,28,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.navbar .count{font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-align:center;flex:1;min-width:0}
.navbar .btn{min-width:96px}
.navbar .count .lbl{display:none}
@media (min-width:480px){.navbar .count .lbl{display:inline}}

/* ---------- Gift ---------- */
.gift-wrap{position:relative;width:220px;height:230px;margin:8px auto 0}
.gift-glow{position:absolute;left:50%;top:55%;width:260px;height:260px;transform:translate(-50%,-50%) scale(.6);border-radius:50%;background:radial-gradient(circle, rgba(243,220,162,.55), rgba(236,143,171,.25) 40%, transparent 70%);opacity:.5;transition:transform 1.2s ease, opacity 1.2s ease}
.box{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:176px;height:200px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
.box .base{position:absolute;bottom:0;left:0;right:0;height:132px;border-radius:6px 6px 10px 10px;background:linear-gradient(160deg,#d66a8d,#a8456a);box-shadow:inset 0 -18px 30px rgba(0,0,0,.18),0 24px 40px -16px rgba(0,0,0,.6);overflow:hidden}
.box .base::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.06) 14px 16px)}
.box .rib-v{position:absolute;bottom:0;left:50%;width:26px;height:132px;transform:translateX(-50%);background:linear-gradient(90deg,#c9963f,var(--gold-soft),#c9963f)}
.box .lid{position:absolute;left:-10px;right:-10px;top:44px;height:42px;border-radius:6px;background:linear-gradient(160deg,#e47c9d,#b9527a);box-shadow:0 8px 14px -6px rgba(0,0,0,.5);transition:transform 1s cubic-bezier(.3,1.4,.4,1), opacity .8s .5s}
.box .lid::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);background:linear-gradient(90deg,#c9963f,var(--gold-soft),#c9963f)}
.bow{position:absolute;top:-30px;width:54px;height:38px;border:9px solid var(--gold);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;z-index:1}
.bow.l{left:calc(50% - 52px);transform:rotate(-18deg)}
.bow.r{right:calc(50% - 52px);transform:rotate(18deg)}
.knot{position:absolute;top:-14px;left:50%;width:22px;height:22px;transform:translateX(-50%);background:var(--gold-soft);border-radius:50%;z-index:2;box-shadow:0 2px 0 #b98636}
.tag{position:absolute;right:-6px;top:118px;background:var(--paper);color:var(--ink);font-family:var(--f-script);font-size:22px;padding:4px 14px 2px;border-radius:3px;transform:rotate(8deg);box-shadow:0 6px 14px -6px rgba(0,0,0,.6);z-index:3}
.tag::before{content:"";position:absolute;left:-7px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--plum-700);transform:translateY(-50%)}
.sparkles{position:absolute;inset:-40px;pointer-events:none}
.sparkles i{position:absolute;width:8px;height:8px;opacity:0;background:var(--gold-soft);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.opening .box{animation:none}
.opening .lid{transform:translateY(-150px) rotate(-24deg) translateX(-30px);opacity:0}
.opening .gift-glow{transform:translate(-50%,-50%) scale(1.8);opacity:1}
.opening .sparkles i{animation:spark 1.4s ease-out forwards}
.opening .tag{transition:opacity .4s;opacity:0}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(90deg)}}
.gift-copy{display:flex;flex-direction:column;gap:14px;align-items:center;transition:opacity .6s}
.opening #giftFoot{opacity:0}
.from{font-family:var(--f-script);font-size:30px;color:var(--gold-soft);margin:0}

/* ---------- Quiz ---------- */
.choices{display:grid;gap:12px;width:100%;max-width:380px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 20px;border-radius:14px;border:1px solid var(--line);background:rgba(250,241,228,.05);cursor:pointer;font-family:var(--f-display);font-size:24px;font-weight:600;min-height:60px;transition:all .25s}
.choice:hover{border-color:var(--gold)}
.choice .mark{font-family:var(--f-body);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choice.tried{opacity:.45}
.choice.right{border-color:var(--gold);background:linear-gradient(135deg,rgba(228,185,97,.22),rgba(236,143,171,.12));box-shadow:0 0 0 4px rgba(228,185,97,.14)}
.choice.right .mark{color:var(--gold-soft)}
.choices.solved .choice:not(.right){opacity:.25;transform:scale(.97)}
.feedback{min-height:1.5em;margin:0;color:var(--rose)}
.reveal-card{display:flex;flex-direction:column;gap:4px;align-items:center;animation:pageIn .7s both}

/* ---------- Puzzle ---------- */
.puzzle-head{display:flex;flex-direction:column;gap:10px;align-items:center}
.howto{font-size:15px;color:var(--muted);margin:0}
.board-wrap{position:relative;width:100%;display:flex;justify-content:center}
.board{--ar:.75;position:relative;aspect-ratio:var(--ar);width:min(100%,calc(44vh * var(--ar)));width:min(100%,calc(44svh * var(--ar)));max-width:100%;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);background:var(--paper);padding:8px;border-radius:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 60px -24px rgba(0,0,0,.75);transform:rotate(-1deg)}
.board.loading{background:linear-gradient(110deg,var(--paper) 30%,#fff9ef 50%,var(--paper) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.tiles{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
.tile{appearance:none;border:0;padding:0;margin:0;cursor:pointer;background-image:var(--img);background-size:200% 300%;background-repeat:no-repeat;position:relative;transition:transform .22s ease, box-shadow .22s ease, filter .2s;touch-action:manipulation;border-radius:0}
.tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(250,241,228,.55);transition:opacity .5s;pointer-events:none}
.tile.selected{z-index:3;transform:scale(1.05);box-shadow:0 0 0 4px var(--gold),0 14px 30px -8px rgba(0,0,0,.7)}
.tile.selected::before{content:"";position:absolute;inset:0;background:rgba(228,185,97,.18);pointer-events:none}
.tile.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(.92);filter:brightness(1.15)}}
.board.previewing .tile::after,.board.solved .tile::after{opacity:0}
.board.solved .tile{cursor:default}
.board.shuffling .tile{animation:shuf .5s ease}
@keyframes shuf{40%{transform:scale(.85) rotate(-3deg);opacity:.5}}
.full-photo{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:cover;opacity:0;pointer-events:none;transition:opacity .9s ease}
.board.peeking .full-photo,.board.solved .full-photo{opacity:1}
.board-note{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(22,11,28,.72);color:var(--cream);font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.placeholder-chip{position:absolute;top:16px;left:16px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;z-index:4;pointer-events:none}
.tape{position:absolute;width:86px;height:26px;background:rgba(243,220,162,.55);top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.status{min-height:1.5em;margin:0;font-size:15px;color:var(--gold-soft)}
.memory-caption{display:flex;flex-direction:column;gap:2px;align-items:center}
.memory-caption .line{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.25}
.memory-caption .soft{color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:21px;margin:0}

/* ---------- Photo frames ---------- */
.frame{position:relative;background:var(--paper);padding:12px 12px 14px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 34px 60px -26px rgba(0,0,0,.8);transform:rotate(1.2deg);max-width:100%}
.frame::before{content:"";position:absolute;inset:-10px 10px 10px -10px;background:var(--plum-700);border-radius:4px;z-index:-1;transform:rotate(-3deg);box-shadow:0 0 0 1px var(--line)}
.frame img{display:block;width:auto;height:auto;max-width:100%;max-height:48vh;max-height:48svh;margin:0 auto;border-radius:2px;background:#e9dcc8}
.frame .open-full{position:absolute;right:20px;bottom:22px}
.caption-note{font-family:var(--f-script);font-size:28px;color:var(--gold-soft);margin:0;max-width:30ch;line-height:1.3}

/* ---------- Family ---------- */
.family-list{display:grid;gap:22px;width:100%}
.vcard{position:relative;border-radius:14px;overflow:hidden;background:var(--plum-800);box-shadow:0 0 0 1px var(--line),0 30px 50px -30px rgba(0,0,0,.8);text-align:left}
.vcard video{display:block;width:100%;max-height:60vh;max-height:60svh;background:#000;aspect-ratio:16/9;object-fit:contain}
.vcover{position:absolute;inset:0;width:100%;border:0;padding:0;cursor:pointer;display:flex;align-items:flex-end;background:var(--plum-700) center/cover no-repeat}
.vcover.no-poster{background:radial-gradient(90% 90% at 30% 20%,rgba(236,143,171,.55),transparent 60%),radial-gradient(80% 80% at 90% 100%,rgba(228,185,97,.35),transparent 60%),var(--plum-700)}
.vcover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(22,11,28,.85))}
.vcover .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(250,241,228,.92);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:1}
.vcover .play svg{width:28px;height:28px;margin-left:5px;fill:var(--rose-deep)}
.vcover .who{position:relative;z-index:1;padding:16px 18px;display:flex;flex-direction:column;gap:0}
.vcover .who small{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.vcover .who b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.vbar .label{font-family:var(--f-display);font-size:20px}
.verror{padding:14px 18px;color:var(--muted);font-size:15px;margin:0}

/* ---------- Cake ---------- */
.cake{width:min(260px,70vw);height:auto;overflow:visible}
.flame{transform-origin:120px 46px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{25%{transform:scale(1.04,.96) rotate(-2deg)}50%{transform:scale(.96,1.06) rotate(1deg)}75%{transform:scale(1.02,.98) rotate(2deg)}}
.flame-glow{transition:opacity .6s}
.out .flame{animation:blow .7s ease-in forwards}
.out .flame-glow{opacity:0}
@keyframes blow{to{transform:scale(.1,.3) skewX(-20deg);opacity:0}}
.smoke{opacity:0}
.out .smoke{animation:smoke 2.4s .4s ease-out forwards}
@keyframes smoke{0%{opacity:0;transform:translateY(0)}20%{opacity:.7}100%{opacity:0;transform:translateY(-40px)}}
.wish-msg{font-family:var(--f-display);font-style:italic;font-size:clamp(30px,8vw,44px);line-height:1.1;margin:0;color:var(--gold-soft);text-wrap:balance;animation:pageIn .8s both}

/* ---------- Letter ---------- */
.letter{position:relative;width:calc(100% - 12px);max-width:520px;text-align:left;color:var(--ink);background:var(--paper);padding:30px 26px 26px;border-radius:3px;
  background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(200,90,126,.14) calc(100% - 1px));background-size:100% 32px;
  box-shadow:0 30px 60px -28px rgba(0,0,0,.8);transform:rotate(-.6deg)}
.letter::before,.letter::after{content:"";position:absolute;inset:0;background:var(--cream);border-radius:3px;z-index:-1}
.letter::before{transform:rotate(2.4deg) translate(6px,6px);background:#ead9c2}
.letter::after{transform:rotate(-2deg) translate(-4px,8px);background:#e1cbb0;z-index:-2}
.letter p{font-family:var(--f-display);font-size:21px;line-height:32px;margin:0 0 16px;font-weight:500}
.letter .sig{font-family:var(--f-script);font-size:40px;color:var(--rose-deep);margin:4px 0 0;line-height:1}
.seal{position:absolute;right:18px;top:-18px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e47c9d,#9d3c62);box-shadow:0 4px 10px rgba(0,0,0,.4);display:grid;place-items:center;color:var(--gold-soft);font-family:var(--f-script);font-size:26px}
.voice{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(250,241,228,.04)}
.voice span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
.voice audio{width:100%}
.clue{width:100%;max-width:520px;border:1px dashed var(--gold);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px}
.clue .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.clue p{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.2;text-wrap:balance}

/* ---------- Lightbox ---------- */
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(14,6,18,.96);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lb-top h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:24px}
.lb-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:30px;align-items:center;padding-block:8px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lb-body figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
.lb-body img{max-width:100%;max-height:78vh;max-height:78svh;object-fit:contain;display:block}
.lb-body figcaption{text-align:center;color:var(--muted)}
.lb-body figcaption b{display:block;font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:22px;font-weight:500}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.preview-chip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4)}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;z-index:70;background:var(--plum-950);overflow-y:auto;color:var(--cream);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed{max-width:760px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.ed h1{font-family:var(--f-display);font-weight:500;font-size:40px;margin:0;line-height:1}
.ed h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
.ed section{border:1px solid rgba(243,220,162,.16);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;background:rgba(250,241,228,.025)}
.ed .notice{border-color:var(--gold);background:rgba(228,185,97,.08)}
.ed .notice p{margin:0;font-size:15px}
.ed label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.ed input[type=text],.ed input[type=date],.ed input[type=password],.ed textarea,.ed select{font:inherit;font-size:16px;color:var(--cream);background:var(--plum-800);border:1px solid rgba(243,220,162,.25);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.ed textarea{min-height:220px;resize:vertical;line-height:1.5}
.ed .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ed-media{border-top:1px solid rgba(243,220,162,.12);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ed-media-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ed-label{font-weight:700}
.ed-status{font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(250,241,228,.08);color:var(--muted)}
.ed-status.ok{background:rgba(228,185,97,.2);color:var(--gold-soft)}
.ed-status.miss{background:rgba(236,143,171,.18);color:var(--rose)}
.ed-hint{margin:0;font-size:14px;color:var(--muted)}
.ed-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.checklist li{display:flex;gap:10px;align-items:baseline}
.checklist .s{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:70px}
.checklist .s.ok{color:var(--gold)} .checklist .s.miss{color:var(--rose)} .checklist .s.opt{color:var(--muted)}
.ed-msg{margin:0;font-size:14px;color:var(--gold-soft);min-height:1.4em}
.ed-actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;padding:12px 0;background:linear-gradient(transparent,var(--plum-950) 30%)}

/* couple puzzle + cute quiz */
.board.big{width:min(100%,calc(70vh * var(--ar)));width:min(100%,calc(70svh * var(--ar)));padding:6px;transform:rotate(-.6deg)}
.board.big .tiles{inset:6px}
.board.big .full-photo{inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.board.big .tile::after{box-shadow:inset 0 0 0 .5px rgba(250,241,228,.6)}
.board.big .tile.home::after{opacity:0}
.board.big .tile.home{cursor:default}
.board.big .tile.selected{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold),0 10px 22px -6px rgba(0,0,0,.8)}
.board.big .tile:disabled{opacity:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg-b{appearance:none;border:0;background:transparent;border-radius:999px;padding:7px 16px;min-height:36px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg-b[aria-pressed="true"]{background:var(--rose-deep);color:#fff}
.progress{width:min(100%,320px);height:6px;border-radius:999px;background:rgba(250,241,228,.12);overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .4s ease}
.hearts{display:flex;gap:10px;justify-content:center}
.hearts .h{display:inline-flex}
.hearts .h svg{width:26px;height:26px;fill:transparent;stroke:var(--rose);stroke-width:1.6;transition:fill .3s}
.hearts .h.now svg{stroke:var(--gold-soft)}
.hearts .h.on svg{fill:var(--rose)}
.hearts .h.beat{animation:beat .6s ease}
@keyframes beat{30%{transform:scale(1.35)}60%{transform:scale(.92)}}
.qbox{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.qbox.swap{animation:pageIn .45s both}
.qtitle{font-size:clamp(30px,8vw,46px)}
.choice .mark svg{width:20px;height:20px;fill:var(--rose)}
.choice.wobble{animation:wobble .4s ease}
@keyframes wobble{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.reveal-card{gap:10px}
.reveal-card .script{max-width:22ch;text-wrap:balance}
.lb-cap{display:block}
.qphoto{margin:6px 0 0;background:var(--paper);padding:8px 8px 10px;border-radius:3px;transform:rotate(-1.5deg);box-shadow:0 20px 40px -20px rgba(0,0,0,.8);max-width:min(100%,300px)}
.qphoto img{display:block;width:100%;height:auto;max-height:42vh;max-height:42svh;object-fit:contain}
.album{width:100%;columns:2;column-gap:14px}
.print{appearance:none;border:0;cursor:pointer;display:block;width:100%;margin:0 0 16px;break-inside:avoid;background:var(--paper);padding:7px 7px 9px;border-radius:3px;position:relative;color:var(--ink);text-align:center;box-shadow:0 18px 30px -18px rgba(0,0,0,.85);transition:transform .25s}
.print:nth-child(odd){transform:rotate(-1.8deg)} .print:nth-child(even){transform:rotate(1.6deg)}
.print:hover{transform:rotate(0) scale(1.02)}
.print.hero{column-span:all;max-width:min(100%,340px);margin:0 auto 22px;transform:rotate(-.8deg)}
.print img{display:block;width:100%;height:auto;border-radius:1px}
.ptape{position:absolute;top:-8px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-4deg);background:rgba(243,220,162,.6);z-index:1}
.pcap{display:block;margin-top:6px;font-family:var(--f-display);font-size:16px;line-height:1.25}
.pcap b{display:block;font-style:italic;color:var(--rose-deep);font-weight:600}
@media (min-width:720px){.album{columns:3}}
.board.big .tile::after{box-shadow:inset 0 0 0 1px rgba(250,241,228,.6)}
.board.big .tile.selected{transform:scale(1.06)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,440px)}
.mcard{appearance:none;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:3/4;position:relative;perspective:600px;border-radius:12px;max-width:100%}
.mface{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.mback{background:linear-gradient(150deg,var(--rose-deep),var(--plum-700));box-shadow:inset 0 0 0 2px rgba(243,220,162,.35),0 8px 16px -8px rgba(0,0,0,.7)}
.mback svg{width:38%;fill:rgba(243,220,162,.55)}
.mfront{background:var(--paper);transform:rotateY(180deg);box-shadow:0 8px 16px -8px rgba(0,0,0,.7)}
.mfront svg{width:64%;height:auto}
.mcard.up .mback{transform:rotateY(-180deg)}
.mcard.up .mfront{transform:rotateY(0)}
.mcard.matched .mfront{box-shadow:0 0 0 3px var(--gold),0 8px 16px -8px rgba(0,0,0,.7)}
.mcard:disabled{cursor:default}
.msay{margin:0;min-height:1.4em;font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--gold-soft);text-wrap:balance}
.soft-line{margin:0;font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--muted)}

/* ---------- Birthday edition ---------- */
.scene-gift{position:relative}
.balloons{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.scene-gift > :not(.balloons){position:relative;z-index:1}
.balloon{position:absolute;bottom:0;width:36px;opacity:.55;animation:floatUp linear infinite;transform:translateY(20vh)}
.balloon svg{display:block;width:100%;height:auto}
@keyframes floatUp{0%{transform:translate(0,20vh)}50%{transform:translate(var(--sway),-45vh)}100%{transform:translate(0,-115vh)}}
.gift-reveal{margin:4px 0 0;position:relative;background:var(--paper);padding:10px 10px 12px;border-radius:3px;max-width:min(76vw,300px);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 60px -24px rgba(0,0,0,.8);animation:riseIn 1s cubic-bezier(.2,.8,.25,1.15) both;transform:rotate(-2deg)}
.gift-reveal img{display:block;width:100%;height:auto;max-height:46vh;max-height:46svh;object-fit:cover;border-radius:2px}
@keyframes riseIn{from{opacity:0;transform:translateY(70px) scale(.55) rotate(5deg)}to{opacity:1;transform:rotate(-2deg)}}
.gift-after{display:flex;flex-direction:column;gap:12px;align-items:center;animation:pageIn .8s .5s both}

.padlock{width:120px;height:auto;overflow:visible;margin:4px auto 0}
.padlock .shackle{transition:transform .7s cubic-bezier(.3,1.5,.5,1);transform-box:view-box;transform-origin:86px 64px}
.padlock.open .shackle{transform:translateY(-16px) rotate(32deg)}
.padlock.shake{animation:wobble .45s ease}
.padlock.open{filter:drop-shadow(0 0 22px rgba(243,220,162,.55))}
.wheels{display:flex;gap:8px;justify-content:center;align-items:center;width:100%;max-width:380px}
.wheel{flex:1 1 0;min-width:34px;max-width:62px;display:flex;flex-direction:column;align-items:center;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(250,241,228,.08),rgba(250,241,228,.02))}
.wb{appearance:none;border:0;background:transparent;cursor:pointer;width:100%;min-height:42px;display:grid;place-items:center;color:var(--gold-soft);touch-action:manipulation}
.wb svg{width:18px;height:18px}
.wb:disabled{opacity:.25;cursor:default}
.wd{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,9vw,44px);line-height:1;padding:2px 0 4px;color:var(--cream);font-variant-numeric:tabular-nums}
.wd.roll{animation:roll .22s ease}
@keyframes roll{40%{transform:translateY(var(--dir,-6px));opacity:.35}}
.wsep{font-family:var(--f-display);font-size:30px;color:var(--gold);flex:0 0 auto}
.lock-solved .wheel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(228,185,97,.14)}

.bunting{display:flex;flex-direction:column;gap:4px;align-items:center;margin-bottom:2px}
.bunt{display:flex;gap:3px;position:relative;padding:0 6px}
.bunt::before{content:"";position:absolute;left:-6px;right:-6px;top:0;border-top:1.5px solid rgba(243,220,162,.7)}
.flag{width:clamp(28px,8.6vw,40px);height:clamp(34px,10.4vw,48px);background:var(--c);clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);display:flex;justify-content:center;padding-top:4px;transform-origin:top center;animation:swing 3.4s ease-in-out infinite}
.flag b{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,5vw,23px);color:var(--plum-900);line-height:1.2}
@keyframes swing{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) * -1))}}

.notes{display:grid;gap:12px;width:min(100%,440px)}
.note{appearance:none;border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;border-radius:14px;padding:16px 18px;min-height:64px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(200,90,126,.35),rgba(62,33,73,.7));transition:all .3s;color:var(--cream)}
.note:hover{border-color:var(--gold)}
.note .nh{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(243,220,162,.15)}
.note .nh svg{width:18px;height:18px;fill:var(--gold-soft)}
.note .nl{font-family:var(--f-display);font-size:23px;line-height:1.2;font-weight:600;color:var(--cream)}
.note .nl small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-top:4px}
.note .nt b{display:block;font-style:italic;color:var(--rose-deep);font-weight:600;margin-bottom:4px}
.note .nt{display:none;font-family:var(--f-display);font-size:21px;line-height:1.35;font-weight:500}
.note.open{background:var(--paper);color:var(--ink);border-color:transparent;cursor:default;box-shadow:0 18px 30px -18px rgba(0,0,0,.85)}
.note.open:nth-child(odd){transform:rotate(-.8deg)} .note.open:nth-child(even){transform:rotate(.8deg)}
.note.open .nh{background:rgba(200,90,126,.14)} .note.open .nh svg{fill:var(--rose-deep)}
.note.open .nl{display:none}
.note.open .nt{display:block;animation:pageIn .5s both}
.ed .draft{color:var(--rose)}
@media (prefers-reduced-motion:reduce){.balloons{display:none}.flag{animation:none;transform:none}}

@media (min-width:720px){
  .scene{gap:22px}
  .family-list{grid-template-columns:1fr 1fr}
  .family-list.single{grid-template-columns:1fr;max-width:520px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .box{animation:none}
}

    '<p class="wish-msg" id="wishMsg" hidden>May this be your most beautiful year yet.</p>';
  var t1, stream = null, raf = 0, out = false, ms = $('#micStatus', el);
  function stopMic(){ cancelAnimationFrame(raf); if (stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; } }
  function blowOut(){
    if (out) return; out = true; stopMic();
    $('#blow', el).disabled = true; $('#micBtn', el).hidden = true; ms.textContent = '';
    $('#cakeBox', el).classList.add('out');
    chime([523, 659, 784]);

  }
  $('#blow', el).addEventListener('click', blowOut);
  var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  var canMic = !framed && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext !== false);
  if (!canMic){ $('#micBtn', el).hidden = true; $('#blowHint', el).textContent = 'Tap the button to blow out the candle.'; }
  $('#micBtn', el).addEventListener('click', function(){
    var mb = this; mb.disabled = true; ms.textContent = 'Asking for the microphone…';

      if (out){ st.getTracks().forEach(function(tr){ tr.stop(); }); return; }
      stream = st;
      var ac = actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended' && ac.resume) ac.resume();
      var src = ac.createMediaStreamSource(st), an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
      var buf = new Float32Array(an.fftSize), t0 = performance.now(), base = 0, n = 0, over = 0;
      ms.textContent = 'Listening… blow now.'; mb.hidden = true;
      (function loop(){
        an.getFloatTimeDomainData(buf);
        var sum = 0; for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        var rms = Math.sqrt(sum / buf.length), el2 = performance.now() - t0;

        }

      })();
    }).catch(function(){

    });
  });
  return function(){ clearTimeout(t1); stopMic(); };
};

function readEmbedded(){ try { return JSON.parse(document.getElementById('gift-config').textContent || '{}'); } catch (e) { return {}; } }
function loadDraft(){ return DB.get('draft-birthday').then(function(d){ return d || null; }, function(){ return null; }); }

function route(){
  var h = (location.hash || '').replace('#','');
  stopStageMedia(); pauseMusic(); music = null;
  var chip = $('.preview-chip'); if (chip) chip.remove();
  $('#lightbox').hidden = true;
  var embedded = merge(DEFAULT_CONFIG, readEmbedded());
  if (h === 'edit' || h === 'preview'){
    loadDraft().then(function(d){
      cfg = d ? merge(embedded, d) : embedded;
      if (h === 'edit'){
        var open = function(){ $('#editor').hidden = false; renderEditor(); };
        if (cfg.editorPin) pinGate(open); else open();
      } else {
        $('#editor').hidden = true; startStory();
        var b = document.createElement('button'); b.type = 'button'; b.className = 'preview-chip'; b.textContent = 'Preview · back to editor';
        b.addEventListener('click', function(){ location.hash = 'edit'; }); document.body.appendChild(b);
      }
    });
  } else {
    cfg = embedded; $('#editor').hidden = true; startStory();
  }
}
function startStory(){ document.title = titleFor(cfg); scenes = buildScenes(); go(0, {focus:false}); }

$('#backBtn').addEventListener('click', function(){ go(idx - 1); });
$('#nextBtn').addEventListener('click', function(){ go(idx + 1); });
$('#soundBtn').addEventListener('click', function(){ setSound(!soundOn); });
$('#lbClose').addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#lightbox').hidden) closeLightbox(); });
document.addEventListener('visibilitychange', function(){ if (document.hidden){ stopStageMedia(); pauseMusic(); } });
window.addEventListener('hashchange', route);
setSound(false);
route();

/* test hook (harmless): lets automated checks read puzzle state */
window.__gift = { scenes: function(){ return scenes.slice(); }, index: function(){ return idx; }, go: go, cfg: function(){ return cfg; } };
})();
</script>
</body>
</html>
